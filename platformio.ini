[env:esp32-c3]
platform = espressif32
board = nologo_esp32c3_super_mini
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=5

lib_deps =
    sui77/rc-switch @ ^2.6.4
    bblanchon/ArduinoJson @ ^6.21.5